version: '3.8'

services:
  # Aplicação MedSync (Node.js)
  medsync-app:
    build: .
    container_name: medsync-app
    # Porta de aplicação interna.
    # Esta porta é exposta apenas internamente para o Traefik.
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - GOOGLE_CLOUD_VISION_KEY=${GOOGLE_CLOUD_VISION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - APP_NAME=MedSync
      - APP_VERSION=1.0.0
    volumes:
      - uploads:/app/uploads
      - ./public:/app/public:ro
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    # INCLUSÃO DAS LABELS DO TRAEFIK (CORREÇÃO CRÍTICA PARA HTTPS)
    labels:
      - "traefik.enable=true"  # Habilita o Traefik para este serviço
      
      # Roteador HTTPS: Define as regras para seu domínio. (Substitua o domínio!)
      - "traefik.http.routers.medsync-app.rule=Host(`medsync.med.br`) || Host(`www.medsync.med.br`)"
      - "traefik.http.routers.medsync-app.entrypoints=https" # Usa a porta 443 do Traefik
      - "traefik.http.routers.medsync-app.tls=true"  # Habilita o TLS (SSL)
      
      # Serviço: Indica a porta interna do container onde o Node.js está ouvindo.
      - "traefik.http.services.medsync-app.loadbalancer.server.port=5000"
      
    # CORREÇÃO CRÍTICA: O serviço deve estar na rede 'coolify' para ser descoberto pelo Traefik.
    networks:
      - coolify
      
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: medsync-postgres
    environment:
      - POSTGRES_DB=medsync
      - POSTGRES_USER=${POSTGRES_USER:-medsync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    # CORREÇÃO DE SEGURANÇA: 'ports' de banco de dados comentadas ou removidas. 
    # O banco de dados não deve ser exposto publicamente.
    # ports:
    #   - "5432:5432" 
    restart: unless-stopped
    # CORREÇÃO: Usando a rede 'coolify' para comunicação interna segura
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medsync} -d medsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    container_name: medsync-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # CORREÇÃO DE SEGURANÇA: 'ports' de Redis comentadas ou removidas. 
    # O Redis não deve ser exposto publicamente.
    # ports:
    #   - "6379:6379" 
    restart: unless-stopped
    # CORREÇÃO: Usando a rede 'coolify' para comunicação interna segura
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# O serviço Nginx foi removido completamente, pois entra em conflito com o Traefik.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local

networks:
  # CORREÇÃO CRÍTICA: Define a rede 'coolify' como externa, permitindo que o Traefik a utilize.
  coolify:
    external: true
